  <text x="60" y="622" font-family="system-ui,-apple-system,sans-serif" font-size="28" text-anchor="middle" fill="#7C3AED">🌅</text>
  <text x="116" y="603" font-family="system-ui,-apple-system,sans-serif" font-size="12" font-weight="600" fill="#1A1A2E">Golden hour magic in every frame ✨</text>
