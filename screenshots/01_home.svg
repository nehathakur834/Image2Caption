  <rect x="20" y="670" width="350" height="80" rx="20" fill="white" stroke="#E9E4F5" stroke-width="1"/>
  <rect x="20" y="670" width="80" height="80" rx="20" fill="#FCE7F3"/>
  <text x="60" y="714" font-family="system-ui,-apple-system,sans-serif" font-size="28" text-anchor="middle" fill="#DB2777">🌸</text>
  <text x="116" y="695" font-family="system-ui,-apple-system,sans-serif" font-size="12" font-weight="600" fill="#1A1A2E">Spring vibes and fresh beginnings 🌸</text>
  <text x="116" y="712" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#6B7280">🏷 9 hashtags · Yesterday</text>
  <text x="348" y="714" font-family="system-ui,-apple-system,sans-serif" font-size="18" fill="#E9E4F5" text-anchor="middle">›</text>

