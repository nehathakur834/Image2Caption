  <rect x="203" y="410" width="167" height="110" rx="20" fill="white" stroke="#E9E4F5" stroke-width="1"/>
  <rect x="219" y="426" width="46" height="46" rx="12" fill="url(#acc3)"/>
  <text x="242" y="455" font-family="system-ui,-apple-system,sans-serif" font-size="20" fill="white" text-anchor="middle">✨</text>
