  <text x="44" y="272" font-family="system-ui,-apple-system,sans-serif" font-size="13" fill="white" fill-opacity="0.82">Upload a photo and let AI write the perfect</text>
  <text x="44" y="288" font-family="system-ui,-apple-system,sans-serif" font-size="13" fill="white" fill-opacity="0.82">caption for any platform.</text>
