  <rect x="0" y="772" width="390" height="72" fill="white"/>
  <line x1="0" y1="772" x2="390" y2="772" stroke="#E9E4F5" stroke-width="1"/>
  <!-- Home selected -->
  <rect x="14" y="782" width="70" height="32" rx="16" fill="url(#brand)"/>
  <text x="49" y="803" font-family="system-ui,-apple-system,sans-serif" font-size="18" text-anchor="middle" fill="white">⌂</text>
