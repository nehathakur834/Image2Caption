  <text x="341" y="803" font-family="system-ui,-apple-system,sans-serif" font-size="17" text-anchor="middle" fill="#9CA3AF">⚙</text>
  <text x="341" y="826" font-family="system-ui,-apple-system,sans-serif" font-size="10" font-weight="500" fill="#9CA3AF" text-anchor="middle">Settings</text>
