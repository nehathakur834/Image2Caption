      <stop offset="0%" stop-color="#6D28D9"/>
      <stop offset="50%" stop-color="#9333EA"/>
      <stop offset="100%" stop-color="#DB2777"/>
    </linearGradient>
    <linearGradient id="acc2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="acc3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DB2777"/>
      <stop offset="100%" stop-color="#9333EA"/>
    </linearGradient>
    <clipPath id="screen"><rect width="390" height="844" rx="40"/></clipPath>
    <clipPath id="heroClip"><rect x="20" y="164" width="350" height="200" rx="20"/></clipPath>
    <clipPath id="card1"><rect x="20" y="420" width="167" height="110" rx="20"/></clipPath>
    <clipPath id="card2"><rect x="203" y="420" width="167" height="110" rx="20"/></clipPath>
  </defs>

  <!-- Phone shell -->
  <rect width="390" height="844" rx="40" fill="#F8F7FC"/>

  <!-- Status bar -->
  <rect width="390" height="52" rx="0" fill="#F8F7FC"/>
  <text x="36" y="34" font-family="system-ui,-apple-system,sans-serif" font-size="14" font-weight="600" fill="#1A1A2E">9:41</text>
  <!-- Battery / signal -->
  <rect x="330" y="24" width="25" height="12" rx="3" fill="none" stroke="#1A1A2E" stroke-width="1.5"/>
  <rect x="331" y="25" width="18" height="10" rx="2" fill="#1A1A2E"/>
  <rect x="356" y="28" width="3" height="5" rx="1" fill="#1A1A2E"/>
