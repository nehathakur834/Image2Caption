<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844">
  <defs>
    <linearGradient id="brand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6D28D9"/>
      <stop offset="50%" stop-color="#9333EA"/>
      <stop offset="100%" stop-color="#DB2777"/>
    </linearGradient>
    <linearGradient id="acc1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#9333EA"/>
    </linearGradient>
    <linearGradient id="acc2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="acc3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DB2777"/>
      <stop offset="100%" stop-color="#9333EA"/>
    </linearGradient>
    <clipPath id="imgClip"><rect x="20" y="138" width="350" height="180" rx="20"/></clipPath>
  </defs>

  <rect width="390" height="844" rx="40" fill="#F8F7FC"/>

  <!-- Status bar -->
  <text x="36" y="34" font-family="system-ui,-apple-system,sans-serif" font-size="14" font-weight="600" fill="#1A1A2E">9:41</text>
  <rect x="330" y="24" width="25" height="12" rx="3" fill="none" stroke="#1A1A2E" stroke-width="1.5"/>
  <rect x="331" y="25" width="18" height="10" rx="2" fill="#1A1A2E"/>
  <rect x="150" y="12" width="90" height="28" rx="14" fill="#1A1A2E"/>

  <!-- Back arrow -->
  <text x="28" y="90" font-family="system-ui,-apple-system,sans-serif" font-size="18" fill="#1A1A2E">‹</text>
  <text x="60" y="88" font-family="system-ui,-apple-system,sans-serif" font-size="18" font-weight="800" fill="#1A1A2E">Your Captions ✨</text>
  <text x="60" y="106" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#6B7280">AI-generated ideas for your post.</text>
  <!-- Favourite icon -->
  <text x="354" y="92" font-family="system-ui,-apple-system,sans-serif" font-size="20" fill="#7C3AED">♡</text>
  <line x1="0" y1="120" x2="390" y2="120" stroke="#E9E4F5" stroke-width="1"/>

  <!-- Hero image -->
  <rect x="20" y="136" width="350" height="176" rx="20" fill="#EDE9FE"/>
  <rect x="20" y="136" width="350" height="176" rx="20" fill="url(#brand)" fill-opacity="0.25"/>
  <text x="195" y="238" font-family="system-ui,-apple-system,sans-serif" font-size="72" text-anchor="middle" dominant-baseline="central">🌅</text>

  <!-- Analysis card -->
  <rect x="20" y="326" width="350" height="102" rx="20" fill="white" stroke="#E9E4F5" stroke-width="1"/>
  <rect x="36" y="342" width="30" height="30" rx="8" fill="url(#acc2)"/>
  <text x="51" y="362" font-family="system-ui,-apple-system,sans-serif" font-size="15" fill="white" text-anchor="middle">🔍</text>
  <text x="76" y="358" font-family="system-ui,-apple-system,sans-serif" font-size="14" font-weight="800" fill="#1A1A2E">AI Image Analysis</text>
  <text x="36" y="380" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#6B7280">Vibrant sunset over ocean horizon with warm golden</text>
  <text x="36" y="396" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#6B7280">tones. Mood: dreamy. Context: nature/travel.</text>
  <!-- Tags -->
  <rect x="36" y="404" width="48" height="20" rx="10" fill="#F3F0FA" stroke="#E9E4F5" stroke-width="1"/>
  <text x="60" y="418" font-family="system-ui,-apple-system,sans-serif" font-size="10" fill="#6B7280" text-anchor="middle">sunset</text>
  <rect x="90" y="404" width="44" height="20" rx="10" fill="#F3F0FA" stroke="#E9E4F5" stroke-width="1"/>
  <text x="112" y="418" font-family="system-ui,-apple-system,sans-serif" font-size="10" fill="#6B7280" text-anchor="middle">ocean</text>
  <rect x="140" y="404" width="60" height="20" rx="10" fill="#F3F0FA" stroke="#E9E4F5" stroke-width="1"/>
  <text x="170" y="418" font-family="system-ui,-apple-system,sans-serif" font-size="10" fill="#6B7280" text-anchor="middle">Mood: dreamy</text>

