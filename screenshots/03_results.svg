  <!-- Caption card 1 - selected -->
  <rect x="20" y="466" width="350" height="76" rx="20" fill="white" stroke="#7C3AED" stroke-width="2"/>
  <rect x="36" y="482" width="26" height="26" rx="6" fill="url(#acc1)"/>
  <text x="49" y="500" font-family="system-ui,-apple-system,sans-serif" font-size="10" font-weight="800" fill="white" text-anchor="middle">01</text>
  <text x="74" y="494" font-family="system-ui,-apple-system,sans-serif" font-size="12" font-weight="600" fill="#1A1A2E">Golden hour magic in every frame ✨</text>
  <text x="74" y="510" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#6B7280">Chase the light, capture the moment.</text>
  <text x="348" y="498" font-family="system-ui,-apple-system,sans-serif" font-size="16" fill="#7C3AED" text-anchor="middle">✓</text>

  <!-- Caption card 2 -->
  <rect x="20" y="550" width="350" height="66" rx="20" fill="white" stroke="#E9E4F5" stroke-width="1"/>
  <rect x="36" y="564" width="26" height="26" rx="6" fill="#F3F0FA"/>
  <text x="49" y="582" font-family="system-ui,-apple-system,sans-serif" font-size="10" font-weight="800" fill="#6B7280" text-anchor="middle">02</text>
  <text x="74" y="576" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#1A1A2E">When the sky becomes your canvas 🎨</text>
  <text x="74" y="592" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#6B7280">Nature never stops creating art.</text>

  <!-- Caption card 3 -->
  <rect x="20" y="624" width="350" height="66" rx="20" fill="white" stroke="#E9E4F5" stroke-width="1"/>
  <rect x="36" y="638" width="26" height="26" rx="6" fill="#F3F0FA"/>
  <text x="49" y="656" font-family="system-ui,-apple-system,sans-serif" font-size="10" font-weight="800" fill="#6B7280" text-anchor="middle">03</text>
  <text x="74" y="650" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#1A1A2E">Sunsets are proof that endings can be</text>
  <text x="74" y="666" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#6B7280">beautiful too 🌇</text>

  <!-- Action row -->
  <rect x="20" y="702" width="108" height="52" rx="14" fill="url(#acc1)"/>
  <text x="74" y="726" font-family="system-ui,-apple-system,sans-serif" font-size="18" text-anchor="middle" fill="white">⎘</text>
  <text x="74" y="745" font-family="system-ui,-apple-system,sans-serif" font-size="10" font-weight="700" fill="white" text-anchor="middle">Copy</text>
  <rect x="140" y="702" width="108" height="52" rx="14" fill="url(#acc2)"/>
  <text x="194" y="726" font-family="system-ui,-apple-system,sans-serif" font-size="17" text-anchor="middle" fill="white">#</text>
  <text x="194" y="745" font-family="system-ui,-apple-system,sans-serif" font-size="10" font-weight="700" fill="white" text-anchor="middle">Hashtags</text>
  <rect x="260" y="702" width="110" height="52" rx="14" fill="url(#acc3)"/>
  <text x="315" y="726" font-family="system-ui,-apple-system,sans-serif" font-size="17" text-anchor="middle" fill="white">↗</text>
  <text x="315" y="745" font-family="system-ui,-apple-system,sans-serif" font-size="10" font-weight="700" fill="white" text-anchor="middle">Share</text>

  <!-- Bottom nav -->
  <rect x="0" y="772" width="390" height="72" fill="white"/>
  <line x1="0" y1="772" x2="390" y2="772" stroke="#E9E4F5" stroke-width="1"/>
  <text x="49" y="803" font-family="system-ui,-apple-system,sans-serif" font-size="17" text-anchor="middle" fill="#9CA3AF">⌂</text>
  <text x="49" y="826" font-family="system-ui,-apple-system,sans-serif" font-size="10" fill="#9CA3AF" text-anchor="middle">Home</text>
  <rect x="111" y="782" width="70" height="32" rx="16" fill="url(#brand)"/>
  <text x="146" y="803" font-family="system-ui,-apple-system,sans-serif" font-size="17" text-anchor="middle" fill="white">✦</text>
  <text x="146" y="826" font-family="system-ui,-apple-system,sans-serif" font-size="10" font-weight="700" fill="#7C3AED" text-anchor="middle">Create</text>
  <text x="244" y="803" font-family="system-ui,-apple-system,sans-serif" font-size="16" text-anchor="middle" fill="#9CA3AF">⊞</text>
  <text x="244" y="826" font-family="system-ui,-apple-system,sans-serif" font-size="10" fill="#9CA3AF" text-anchor="middle">History</text>
  <text x="341" y="803" font-family="system-ui,-apple-system,sans-serif" font-size="16" text-anchor="middle" fill="#9CA3AF">⚙</text>
  <text x="341" y="826" font-family="system-ui,-apple-system,sans-serif" font-size="10" fill="#9CA3AF" text-anchor="middle">Settings</text>
</svg>
