<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844">
  <defs>
    <linearGradient id="brand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6D28D9"/>
      <stop offset="50%" stop-color="#9333EA"/>
      <stop offset="100%" stop-color="#DB2777"/>
    </linearGradient>
    <linearGradient id="acc2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="acc1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#9333EA"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="390" height="844" rx="40" fill="#F8F7FC"/>

  <!-- Status bar -->
  <text x="36" y="34" font-family="system-ui,-apple-system,sans-serif" font-size="14" font-weight="600" fill="#1A1A2E">9:41</text>
  <rect x="330" y="24" width="25" height="12" rx="3" fill="none" stroke="#1A1A2E" stroke-width="1.5"/>
  <rect x="331" y="25" width="18" height="10" rx="2" fill="#1A1A2E"/>
  <rect x="356" y="28" width="3" height="5" rx="1" fill="#1A1A2E"/>
  <rect x="150" y="12" width="90" height="28" rx="14" fill="#1A1A2E"/>

  <!-- App bar -->
  <text x="20" y="88" font-family="system-ui,-apple-system,sans-serif" font-size="20" font-weight="800" fill="#1A1A2E" letter-spacing="-0.3">Create Caption</text>
  <text x="20" y="110" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#6B7280">Upload a photo and let AI do the creative work.</text>
  <line x1="0" y1="122" x2="390" y2="122" stroke="#E9E4F5" stroke-width="1"/>

  <!-- Upload card dashed border area -->
  <rect x="20" y="138" width="350" height="260" rx="20" fill="#F9F5FF" stroke="#7C3AED" stroke-width="2" stroke-dasharray="6,4" stroke-opacity="0.5"/>

  <!-- Upload icon orb -->
  <circle cx="195" cy="224" r="48" fill="url(#brand)"/>
  <!-- shadow glow -->
  <circle cx="195" cy="224" r="48" fill="url(#brand)" fill-opacity="0.3"/>
  <text x="195" y="234" font-family="system-ui,-apple-system,sans-serif" font-size="36" text-anchor="middle" fill="white">📷</text>

  <text x="195" y="296" font-family="system-ui,-apple-system,sans-serif" font-size="19" font-weight="800" fill="#1A1A2E" text-anchor="middle" letter-spacing="-0.3">Upload your image</text>
  <text x="195" y="316" font-family="system-ui,-apple-system,sans-serif" font-size="13" fill="#6B7280" text-anchor="middle">Choose from gallery or capture with camera</text>

  <!-- Gallery + Camera buttons -->
  <rect x="44" y="336" width="140" height="46" rx="14" fill="url(#acc2)"/>
  <text x="114" y="364" font-family="system-ui,-apple-system,sans-serif" font-size="14" font-weight="700" fill="white" text-anchor="middle">🖼  Gallery</text>

  <rect x="202" y="336" width="140" height="46" rx="14" fill="url(#acc1)"/>
  <text x="272" y="364" font-family="system-ui,-apple-system,sans-serif" font-size="14" font-weight="700" fill="white" text-anchor="middle">📷  Camera</text>

  <!-- Options card -->
  <rect x="20" y="414" width="350" height="246" rx="20" fill="white" stroke="#E9E4F5" stroke-width="1"/>

  <!-- Caption Tone section -->
  <text x="40" y="442" font-family="system-ui,-apple-system,sans-serif" font-size="16" font-weight="800" fill="#1A1A2E">Caption Tone</text>
  <text x="40" y="458" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#6B7280">Leave on Auto to let AI decide</text>

  <!-- Tone chips -->
  <rect x="40" y="468" width="52" height="28" rx="14" fill="url(#brand)"/>
  <text x="66" y="487" font-family="system-ui,-apple-system,sans-serif" font-size="11" font-weight="700" fill="white" text-anchor="middle">✦ Auto</text>

  <rect x="100" y="468" width="60" height="28" rx="14" fill="#F3F0FA" stroke="#E9E4F5" stroke-width="1"/>
  <text x="130" y="487" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#6B7280" text-anchor="middle">😄 Funny</text>

  <rect x="168" y="468" width="88" height="28" rx="14" fill="#F3F0FA" stroke="#E9E4F5" stroke-width="1"/>
  <text x="212" y="487" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#6B7280" text-anchor="middle">💼 Professional</text>

  <rect x="264" y="468" width="80" height="28" rx="14" fill="#F3F0FA" stroke="#E9E4F5" stroke-width="1"/>
  <text x="304" y="487" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#6B7280" text-anchor="middle">❤ Romantic</text>

  <!-- Platform -->
  <text x="40" y="520" font-family="system-ui,-apple-system,sans-serif" font-size="16" font-weight="800" fill="#1A1A2E">Platform</text>
  <rect x="40" y="530" width="90" height="28" rx="14" fill="url(#brand)"/>
  <text x="85" y="549" font-family="system-ui,-apple-system,sans-serif" font-size="11" font-weight="700" fill="white" text-anchor="middle">📸 Instagram</text>
  <rect x="138" y="530" width="76" height="28" rx="14" fill="#F3F0FA" stroke="#E9E4F5" stroke-width="1"/>
  <text x="176" y="549" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#6B7280" text-anchor="middle">💼 LinkedIn</text>
  <rect x="222" y="530" width="72" height="28" rx="14" fill="#F3F0FA" stroke="#E9E4F5" stroke-width="1"/>
  <text x="258" y="549" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#6B7280" text-anchor="middle">𝕏 Twitter</text>

  <!-- Language -->
  <text x="40" y="582" font-family="system-ui,-apple-system,sans-serif" font-size="16" font-weight="800" fill="#1A1A2E">Language</text>
  <rect x="40" y="592" width="78" height="28" rx="14" fill="url(#brand)"/>
  <text x="79" y="611" font-family="system-ui,-apple-system,sans-serif" font-size="11" font-weight="700" fill="white" text-anchor="middle">🌐 English</text>
  <rect x="126" y="592" width="64" height="28" rx="14" fill="#F3F0FA" stroke="#E9E4F5" stroke-width="1"/>
  <text x="158" y="611" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#6B7280" text-anchor="middle">हि Hindi</text>

  <!-- Generate button -->
  <text x="195" y="688" font-family="system-ui,-apple-system,sans-serif" font-size="14" font-weight="600" fill="#6B7280" text-anchor="middle">Ready to create? ✨</text>
  <rect x="20" y="700" width="350" height="52" rx="16" fill="url(#brand)"/>
  <text x="195" y="732" font-family="system-ui,-apple-system,sans-serif" font-size="15" font-weight="700" fill="white" text-anchor="middle">✦  Generate Captions</text>

  <!-- Bottom nav -->
  <rect x="0" y="772" width="390" height="72" fill="white"/>
  <line x1="0" y1="772" x2="390" y2="772" stroke="#E9E4F5" stroke-width="1"/>
  <text x="49" y="803" font-family="system-ui,-apple-system,sans-serif" font-size="17" text-anchor="middle" fill="#9CA3AF">⌂</text>
  <text x="49" y="826" font-family="system-ui,-apple-system,sans-serif" font-size="10" fill="#9CA3AF" text-anchor="middle">Home</text>
  <!-- Create selected -->
  <rect x="111" y="782" width="70" height="32" rx="16" fill="url(#brand)"/>
  <text x="146" y="803" font-family="system-ui,-apple-system,sans-serif" font-size="17" text-anchor="middle" fill="white">✦</text>
  <text x="146" y="826" font-family="system-ui,-apple-system,sans-serif" font-size="10" font-weight="700" fill="#7C3AED" text-anchor="middle">Create</text>
  <text x="244" y="803" font-family="system-ui,-apple-system,sans-serif" font-size="16" text-anchor="middle" fill="#9CA3AF">⊞</text>
  <text x="244" y="826" font-family="system-ui,-apple-system,sans-serif" font-size="10" fill="#9CA3AF" text-anchor="middle">History</text>
  <text x="341" y="803" font-family="system-ui,-apple-system,sans-serif" font-size="16" text-anchor="middle" fill="#9CA3AF">⚙</text>
  <text x="341" y="826" font-family="system-ui,-apple-system,sans-serif" font-size="10" fill="#9CA3AF" text-anchor="middle">Settings</text>
</svg>
